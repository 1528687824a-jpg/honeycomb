name: agent-openclaw

services:
  postgres:
    image: postgres:17-alpine
    container_name: agent-openclaw-postgres
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres17-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d temporal"]
      interval: 5s
      timeout: 5s
      retries: 20

  orchestrator-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: agent-openclaw-orchestrator-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://temporal:temporal@postgres:5432/temporal
      DBOS_SYSTEM_DATABASE_URL: postgresql://temporal:temporal@postgres:5432/temporal
      DBOS_SYSTEM_DATABASE_SCHEMA: dbos
      ORCHESTRATOR_PORT: "3000"
      ORCHESTRATOR_HOST: "0.0.0.0"
      ORCHESTRATOR_CORS_ORIGINS: ${ORCHESTRATOR_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,tauri://localhost,http://tauri.localhost,https://tauri.localhost}
      HONEYCOMB_API_TOKEN: ${HONEYCOMB_API_TOKEN:-}
      JOB_DATA_DIR: /app/data/jobs
      FEISHU_ADAPTER_ENABLED: "false"
      FEISHU_DRY_RUN: "true"
      OPENCLAW_AGENT_MODE: ${OPENCLAW_AGENT_MODE:-mock}
      OPENCLAW_AGENT_RUNNER: ${OPENCLAW_AGENT_RUNNER:-provider-direct}
      HONEYCOMB_RUNTIME_MAINTENANCE_ENABLED: ${HONEYCOMB_RUNTIME_MAINTENANCE_ENABLED:-true}
      HONEYCOMB_RUNTIME_MAINTENANCE_INTERVAL_SECONDS: ${HONEYCOMB_RUNTIME_MAINTENANCE_INTERVAL_SECONDS:-30}
      HONEYCOMB_RUNTIME_MAINTENANCE_HEARTBEAT_LIMIT: ${HONEYCOMB_RUNTIME_MAINTENANCE_HEARTBEAT_LIMIT:-100}
      HONEYCOMB_RUNTIME_MAINTENANCE_MODEL_CALL_LIMIT: ${HONEYCOMB_RUNTIME_MAINTENANCE_MODEL_CALL_LIMIT:-100}
      HONEYCOMB_RUNTIME_MAINTENANCE_STALE_SECONDS: ${HONEYCOMB_RUNTIME_MAINTENANCE_STALE_SECONDS:-}
      JOB_HEARTBEAT_TIMEOUT_SECONDS: ${JOB_HEARTBEAT_TIMEOUT_SECONDS:-300}
      HONEYCOMB_JOB_UPDATE_STREAM_MAX_CONNECTIONS: ${HONEYCOMB_JOB_UPDATE_STREAM_MAX_CONNECTIONS:-8}
      HONEYCOMB_RUNTIME_CONTAINER: "true"
      HONEYCOMB_SECRET_DIR: /app/honeycomb-secrets
      HONEYCOMB_OPENCLAW_RUNTIME_DIR: /app/honeycomb-runtime
      AGENT_CLUSTER_CONFIG_PATH: ${AGENT_CLUSTER_CONFIG_PATH:-}
      HONEYCOMB_AGENT_MODEL_CONFIG_PATH: ${HONEYCOMB_AGENT_MODEL_CONFIG_PATH:-}
      HONEYCOMB_FIRST_RUN_AGENTS_DIR: ${HONEYCOMB_FIRST_RUN_AGENTS_DIR:-}
      HONEYCOMB_PANEL_SUPERVISOR_AGENT_ID: ${HONEYCOMB_PANEL_SUPERVISOR_AGENT_ID:-panel-supervisor-agent}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - job-data:/app/data/jobs
      - ${HONEYCOMB_SECRET_HOST_DIR:-./.runtime/honeycomb-secrets}:/app/honeycomb-secrets
      - ${HONEYCOMB_OPENCLAW_RUNTIME_HOST_DIR:-./.runtime/honeycomb-empty}:/app/honeycomb-runtime
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
        ]
      interval: 5s
      timeout: 5s
      retries: 30

  dbos-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: agent-openclaw-dbos-worker
    depends_on:
      orchestrator-api:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://temporal:temporal@postgres:5432/temporal
      DBOS_SYSTEM_DATABASE_URL: postgresql://temporal:temporal@postgres:5432/temporal
      DBOS_SYSTEM_DATABASE_SCHEMA: dbos
      JOB_DATA_DIR: /app/data/jobs
      FEISHU_ADAPTER_ENABLED: "false"
      FEISHU_DRY_RUN: "true"
      OPENCLAW_AGENT_MODE: ${OPENCLAW_AGENT_MODE:-mock}
      OPENCLAW_AGENT_RUNNER: ${OPENCLAW_AGENT_RUNNER:-provider-direct}
      OPENCLAW_AGENT_TIMEOUT_SECONDS: ${OPENCLAW_AGENT_TIMEOUT_SECONDS:-600}
      MODEL_CALL_LEASE_SECONDS: ${MODEL_CALL_LEASE_SECONDS:-900}
      HONEYCOMB_RUNTIME_MAINTENANCE_ENABLED: ${HONEYCOMB_RUNTIME_MAINTENANCE_ENABLED:-true}
      HONEYCOMB_RUNTIME_MAINTENANCE_INTERVAL_SECONDS: ${HONEYCOMB_RUNTIME_MAINTENANCE_INTERVAL_SECONDS:-30}
      HONEYCOMB_RUNTIME_MAINTENANCE_HEARTBEAT_LIMIT: ${HONEYCOMB_RUNTIME_MAINTENANCE_HEARTBEAT_LIMIT:-100}
      HONEYCOMB_RUNTIME_MAINTENANCE_MODEL_CALL_LIMIT: ${HONEYCOMB_RUNTIME_MAINTENANCE_MODEL_CALL_LIMIT:-100}
      HONEYCOMB_RUNTIME_MAINTENANCE_STALE_SECONDS: ${HONEYCOMB_RUNTIME_MAINTENANCE_STALE_SECONDS:-}
      JOB_HEARTBEAT_TIMEOUT_SECONDS: ${JOB_HEARTBEAT_TIMEOUT_SECONDS:-300}
      OPENCLAW_VIDEO_POLL_INTERVAL_MS: ${OPENCLAW_VIDEO_POLL_INTERVAL_MS:-10000}
      OPENCLAW_VIDEO_POLL_WINDOW_MS: ${OPENCLAW_VIDEO_POLL_WINDOW_MS:-}
      OPENCLAW_VIDEO_STATUS_REQUEST_TIMEOUT_MS: ${OPENCLAW_VIDEO_STATUS_REQUEST_TIMEOUT_MS:-30000}
      OPENCLAW_MEDIA_DOWNLOAD_TIMEOUT_MS: ${OPENCLAW_MEDIA_DOWNLOAD_TIMEOUT_MS:-60000}
      OPENCLAW_MEDIA_DOWNLOAD_MAX_BYTES: ${OPENCLAW_MEDIA_DOWNLOAD_MAX_BYTES:-262144000}
      HONEYCOMB_IMAGE_NORMALIZE_MAX_INPUT_BYTES: ${HONEYCOMB_IMAGE_NORMALIZE_MAX_INPUT_BYTES:-52428800}
      HONEYCOMB_IMAGE_NORMALIZE_MAX_OUTPUT_BYTES: ${HONEYCOMB_IMAGE_NORMALIZE_MAX_OUTPUT_BYTES:-104857600}
      HONEYCOMB_IMAGE_NORMALIZE_MAX_INPUT_PIXELS: ${HONEYCOMB_IMAGE_NORMALIZE_MAX_INPUT_PIXELS:-100000000}
      HONEYCOMB_IMAGE_NORMALIZE_MAX_OUTPUT_PIXELS: ${HONEYCOMB_IMAGE_NORMALIZE_MAX_OUTPUT_PIXELS:-100000000}
      HONEYCOMB_IMAGE_NORMALIZE_MAX_DIMENSION: ${HONEYCOMB_IMAGE_NORMALIZE_MAX_DIMENSION:-32768}
      HONEYCOMB_IMAGE_NORMALIZE_MAX_CROP_FRACTION: ${HONEYCOMB_IMAGE_NORMALIZE_MAX_CROP_FRACTION:-0.15}
      HONEYCOMB_IMAGE_NORMALIZE_TIMEOUT_SECONDS: ${HONEYCOMB_IMAGE_NORMALIZE_TIMEOUT_SECONDS:-60}
      HONEYCOMB_DOCUMENT_MAX_INPUT_BYTES: ${HONEYCOMB_DOCUMENT_MAX_INPUT_BYTES:-52428800}
      HONEYCOMB_DOCUMENT_MAX_OUTPUT_BYTES: ${HONEYCOMB_DOCUMENT_MAX_OUTPUT_BYTES:-104857600}
      HONEYCOMB_DOCUMENT_MAX_TEXT_CHARACTERS: ${HONEYCOMB_DOCUMENT_MAX_TEXT_CHARACTERS:-2000000}
      HONEYCOMB_DOCUMENT_MAX_ZIP_ENTRIES: ${HONEYCOMB_DOCUMENT_MAX_ZIP_ENTRIES:-5000}
      HONEYCOMB_DOCUMENT_MAX_ZIP_UNCOMPRESSED_BYTES: ${HONEYCOMB_DOCUMENT_MAX_ZIP_UNCOMPRESSED_BYTES:-209715200}
      HONEYCOMB_DOCUMENT_MAX_ZIP_ENTRY_BYTES: ${HONEYCOMB_DOCUMENT_MAX_ZIP_ENTRY_BYTES:-20971520}
      HONEYCOMB_DOCUMENT_MAX_DISCOVERED_FILES: ${HONEYCOMB_DOCUMENT_MAX_DISCOVERED_FILES:-200}
      HONEYCOMB_DOCUMENT_MAX_DISCOVERY_DEPTH: ${HONEYCOMB_DOCUMENT_MAX_DISCOVERY_DEPTH:-3}
      HONEYCOMB_DOCUMENT_PDF_FONT_PATH: ${HONEYCOMB_DOCUMENT_PDF_FONT_PATH:-/usr/share/fonts/noto/NotoSansCJK-Regular.ttc}
      HONEYCOMB_DOCUMENT_PDF_FONT_FACE: ${HONEYCOMB_DOCUMENT_PDF_FONT_FACE:-NotoSansCJKsc-Regular}
      HONEYCOMB_MODEL_CONCURRENCY_GLOBAL: ${HONEYCOMB_MODEL_CONCURRENCY_GLOBAL:-4}
      HONEYCOMB_MODEL_CONCURRENCY_PER_PROVIDER: ${HONEYCOMB_MODEL_CONCURRENCY_PER_PROVIDER:-2}
      HONEYCOMB_MODEL_CONCURRENCY_PER_AGENT: ${HONEYCOMB_MODEL_CONCURRENCY_PER_AGENT:-1}
      HONEYCOMB_MODEL_QUEUE_POLL_MS: ${HONEYCOMB_MODEL_QUEUE_POLL_MS:-750}
      HONEYCOMB_MODEL_QUEUE_WAIT_TIMEOUT_SECONDS: ${HONEYCOMB_MODEL_QUEUE_WAIT_TIMEOUT_SECONDS:-600}
      HONEYCOMB_MODEL_QUEUE_HEARTBEAT_TTL_SECONDS: ${HONEYCOMB_MODEL_QUEUE_HEARTBEAT_TTL_SECONDS:-30}
      HONEYCOMB_MODEL_QUEUE_LEASE_GRACE_SECONDS: ${HONEYCOMB_MODEL_QUEUE_LEASE_GRACE_SECONDS:-45}
      HONEYCOMB_JOB_CANCELLATION_POLL_MS: ${HONEYCOMB_JOB_CANCELLATION_POLL_MS:-750}
      HONEYCOMB_MODEL_RETRY_MAX_ATTEMPTS: ${HONEYCOMB_MODEL_RETRY_MAX_ATTEMPTS:-3}
      HONEYCOMB_MODEL_RETRY_BASE_DELAY_MS: ${HONEYCOMB_MODEL_RETRY_BASE_DELAY_MS:-1000}
      HONEYCOMB_MODEL_RETRY_MAX_DELAY_MS: ${HONEYCOMB_MODEL_RETRY_MAX_DELAY_MS:-60000}
      HONEYCOMB_MODEL_RETRY_JITTER_RATIO: ${HONEYCOMB_MODEL_RETRY_JITTER_RATIO:-0.2}
      HONEYCOMB_RUNTIME_CONTAINER: "true"
      HONEYCOMB_SECRET_DIR: /app/honeycomb-secrets
      HONEYCOMB_OPENCLAW_RUNTIME_DIR: /app/honeycomb-runtime
      AGENT_CLUSTER_CONFIG_PATH: ${AGENT_CLUSTER_CONFIG_PATH:-}
      HONEYCOMB_AGENT_MODEL_CONFIG_PATH: ${HONEYCOMB_AGENT_MODEL_CONFIG_PATH:-}
      HONEYCOMB_FIRST_RUN_AGENTS_DIR: ${HONEYCOMB_FIRST_RUN_AGENTS_DIR:-}
      HONEYCOMB_PANEL_SUPERVISOR_AGENT_ID: ${HONEYCOMB_PANEL_SUPERVISOR_AGENT_ID:-panel-supervisor-agent}
    volumes:
      - job-data:/app/data/jobs
      - ${HONEYCOMB_SECRET_HOST_DIR:-./.runtime/honeycomb-secrets}:/app/honeycomb-secrets
      - ${HONEYCOMB_OPENCLAW_RUNTIME_HOST_DIR:-./.runtime/honeycomb-empty}:/app/honeycomb-runtime

volumes:
  job-data:
  postgres17-data:
